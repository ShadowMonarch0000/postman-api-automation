name: Postman API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run Postman collection
        uses: postmanlabs/postman-cli-action@v1
        with:
          command: 'collection run "REST API Automation - JSONPlaceholder.postman_collection.json" --env-var "baseUrl=https://jsonplaceholder.typicode.com" --env-var "postId=1" -r cli,html'

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: postman-cli-reports/*.html
          if-no-files-found: warn
