name: Postman API Automation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Postman CLI
        run: npm install -g postman-cli

      - name: Run Postman collection
        run: |
          postman collection run "REST API Automation - JSONPlaceholder.postman_collection.json" \
            --environment "JSONPlaceholder Environment.postman_environment.json" \
            -r cli,html

      - name: Upload HTML test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-api-test-report
          path: postman-cli-reports/*.html
          if-no-files-found: warn
